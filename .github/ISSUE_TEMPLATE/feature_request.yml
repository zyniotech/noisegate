name: Feature Request
description: Propose a neutral UI, filtering, or accessibility improvement for NoiseGate.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What problem does this solve while keeping NoiseGate neutral and local-first?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Proposed Behavior
    validations:
      required: false
