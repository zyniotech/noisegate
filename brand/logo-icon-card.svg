<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="ng-bg" cx="50%" cy="35%" r="72%">
      <stop offset="0%" stop-color="#1D222D" />
      <stop offset="55%" stop-color="#0F1219" />
      <stop offset="100%" stop-color="#07090D" />
    </radialGradient>

    <linearGradient id="ng-metal" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#525D70" />
      <stop offset="24%" stop-color="#252C38" />
      <stop offset="58%" stop-color="#151922" />
      <stop offset="86%" stop-color="#2D3645" />
      <stop offset="100%" stop-color="#11141B" />
    </linearGradient>

    <linearGradient id="ng-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.86" />
      <stop offset="32%" stop-color="#94A3B8" stop-opacity="0.36" />
      <stop offset="68%" stop-color="#334155" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.54" />
    </linearGradient>

    <radialGradient id="ng-lens" cx="38%" cy="34%" r="68%">
      <stop offset="0%" stop-color="#1E3F66" />
      <stop offset="44%" stop-color="#0E1C33" />
      <stop offset="82%" stop-color="#070D18" />
      <stop offset="100%" stop-color="#03060C" />
    </radialGradient>

    <linearGradient id="ng-ar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.30" />
      <stop offset="42%" stop-color="#6366F1" stop-opacity="0.08" />
      <stop offset="76%" stop-color="#0EA5E9" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.20" />
    </linearGradient>

    <linearGradient id="ng-shutter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#222834" />
      <stop offset="72%" stop-color="#374153" />
      <stop offset="100%" stop-color="#616E84" />
    </linearGradient>

    <filter id="ng-brushed">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.65" numOctaves="2" result="n" />
      <feColorMatrix type="saturate" values="0" in="n" result="g" />
      <feComponentTransfer in="g" result="a">
        <feFuncA type="linear" slope="0.055" />
      </feComponentTransfer>
      <feBlend mode="overlay" in="SourceGraphic" in2="a" />
    </filter>

    <clipPath id="ng-body-clip">
      <path d="M 901.88 611.49 Q 901.88 673.49 858.04 717.33 L 717.33 858.04 Q 673.49 901.88 611.49 901.88 L 412.51 901.88 Q 350.51 901.88 306.67 858.04 L 165.96 717.33 Q 122.12 673.49 122.12 611.49 L 122.12 412.51 Q 122.12 350.51 165.96 306.67 L 306.67 165.96 Q 350.51 122.12 412.51 122.12 L 611.49 122.12 Q 673.49 122.12 717.33 165.96 L 858.04 306.67 Q 901.88 350.51 901.88 412.51 Z" />
    </clipPath>

    <clipPath id="ng-lens-clip">
      <circle cx="512" cy="512" r="276" />
    </clipPath>

    <filter id="ng-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="ng-wave-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#ng-bg)" />

  <g filter="url(#ng-shadow)">
    <path d="M 901.88 611.49 Q 901.88 673.49 858.04 717.33 L 717.33 858.04 Q 673.49 901.88 611.49 901.88 L 412.51 901.88 Q 350.51 901.88 306.67 858.04 L 165.96 717.33 Q 122.12 673.49 122.12 611.49 L 122.12 412.51 Q 122.12 350.51 165.96 306.67 L 306.67 165.96 Q 350.51 122.12 412.51 122.12 L 611.49 122.12 Q 673.49 122.12 717.33 165.96 L 858.04 306.67 Q 901.88 350.51 901.88 412.51 Z" fill="url(#ng-metal)" />
    <g clip-path="url(#ng-body-clip)">
      <rect x="60" y="60" width="904" height="904" fill="url(#ng-metal)" filter="url(#ng-brushed)" />
    </g>
    <path d="M 901.88 611.49 Q 901.88 673.49 858.04 717.33 L 717.33 858.04 Q 673.49 901.88 611.49 901.88 L 412.51 901.88 Q 350.51 901.88 306.67 858.04 L 165.96 717.33 Q 122.12 673.49 122.12 611.49 L 122.12 412.51 Q 122.12 350.51 165.96 306.67 L 306.67 165.96 Q 350.51 122.12 412.51 122.12 L 611.49 122.12 Q 673.49 122.12 717.33 165.96 L 858.04 306.67 Q 901.88 350.51 901.88 412.51 Z" fill="none" stroke="url(#ng-bevel)" stroke-width="6" />
    <path d="M 881.55 613.07 Q 881.55 665.07 844.78 701.84 L 701.84 844.78 Q 665.07 881.55 613.07 881.55 L 410.93 881.55 Q 358.93 881.55 322.16 844.78 L 179.22 701.84 Q 142.45 665.07 142.45 613.07 L 142.45 410.93 Q 142.45 358.93 179.22 322.16 L 322.16 179.22 Q 358.93 142.45 410.93 142.45 L 613.07 142.45 Q 665.07 142.45 701.84 179.22 L 844.78 322.16 Q 881.55 358.93 881.55 410.93 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2" />

    <!-- Precision Inner Optical Bezel -->
    <circle cx="512" cy="512" r="322" fill="#0B0E15" stroke="#4B5563" stroke-width="4" opacity="0.95" />
    <circle cx="512" cy="512" r="304" fill="none" stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="3 11" opacity="0.42" />
  </g>

  <!-- Recessed Sapphire Lens -->
  <circle cx="512" cy="512" r="276" fill="url(#ng-lens)" stroke="#334155" stroke-width="4" />

  <g clip-path="url(#ng-lens-clip)">
    <circle cx="512" cy="512" r="276" fill="url(#ng-ar)" />
    <ellipse cx="424" cy="348" rx="206" ry="84" transform="rotate(-24 424 348)" fill="#FFFFFF" opacity="0.085" />

    <!-- Left Machined Titanium Gate Shutter -->
    <rect x="190" y="190" width="238" height="644" fill="url(#ng-shutter)" />
    <rect x="421" y="190" width="7" height="644" fill="#F1F5F9" opacity="0.86" />

    <!-- Muted Noise Trace Blocked on Left Shutter -->
    <path d="M 256 512 L 290 494 L 316 528 L 342 500 L 368 522 L 394 512 L 420 512"
          fill="none" stroke="#0F172A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.62" />
    <line x1="258" y1="448" x2="390" y2="448" stroke="#0F172A" stroke-width="2.5" opacity="0.34" />
    <line x1="258" y1="576" x2="390" y2="576" stroke="#0F172A" stroke-width="2.5" opacity="0.34" />

    <!-- Subtle Calibration Horizon Line -->
    <line x1="428" y1="512" x2="795" y2="512" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 10" opacity="0.34" />

    <!-- Pure Luminous Optical Signal Wave -->
    <path d="M 436 512 C 474 512, 488 360, 540 360 C 592 360, 606 664, 658 664 C 708 664, 720 512, 766 512"
          fill="none" stroke="#38BDF8" stroke-width="30" stroke-linecap="round" opacity="0.30" filter="url(#ng-wave-glow)" />
    <path d="M 436 512 C 474 512, 488 360, 540 360 C 592 360, 606 664, 658 664 C 708 664, 720 512, 766 512"
          fill="none" stroke="#F8FAFC" stroke-width="20" stroke-linecap="round" />
  </g>

  <circle cx="512" cy="512" r="276" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2.5" />
</svg>